name: Deploy Wayline to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wayline-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      html-sha256: ${{ steps.package.outputs.html-sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone application
        run: |
          python3 build.py
          git diff --exit-code -- index.html
      - name: Core tests
        run: node tests/test_core.mjs
      - name: Install Playwright
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Browser integration checks
        run: python3 tests/test_browser.py
      - name: Save browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: |
            tests/results.json
            tests/*.png
          retention-days: 14
      - name: Assemble and fingerprint static site
        id: package
        run: |
          mkdir -p _site/examples
          cp index.html _site/index.html
          cp examples/overlays.geojson _site/examples/overlays.geojson
          touch _site/.nojekyll
          echo "html-sha256=$(sha256sum _site/index.html | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

  deploy:
    name: Deploy and verify live site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages publishing configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{html_url, build_type, source}'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify served HTML matches the validated artifact
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA256: ${{ needs.validate.outputs.html-sha256 }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location --max-time 20 \
              "${SITE_URL}?revision=${SOURCE_SHA}" -o "$RUNNER_TEMP/published-index.html"; then
              actual=$(sha256sum "$RUNNER_TEMP/published-index.html" | cut -d ' ' -f 1)
              if [ "$actual" = "$EXPECTED_SHA256" ]; then
                echo "Verified live site: $SITE_URL"
                echo "HTML SHA256: $actual"
                printf '## Wayline deployed\n\n[Open the live app](%s)\n\nThe served HTML SHA256 matches the tested build: `%s`.\n' "$SITE_URL" "$actual" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
            sleep 5
          done
          echo '::error::Live HTML did not match the validated artifact before timeout.'
          exit 1
