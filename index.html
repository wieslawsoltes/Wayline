<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9fb"><meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Wayline — your world, a little closer. An independent WebGPU map explorer and geographic editor built with plain JavaScript.">
<title>Wayline — Your world, a little closer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%232563eb'/%3E%3Cpath d='m12 35 12-23 12 23-12-7z' fill='white'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme:light;
  --bg:#fff;
  --surface:#fff;
  --surface-alt:#f6f8fa;
  --surface-hover:#eef3fa;
  --text:#263341;
  --muted:#7b8490;
  --subtle:#a1a8b2;
  --border:#e9edf2;
  --accent:#2b6ee9;

  --sidebar:360px;
  --radius:16px;
  --map-shift:calc(var(--rail) + var(--sidebar));
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  color:var(--text);
  background:var(--surface-alt);
  overflow:hidden
}
button,input,select,textarea {
  font:inherit
}
button {
  cursor:pointer;
  border:0;
  background:transparent;
  color:inherit;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  user-select:none;
  -webkit-tap-highlight-color:transparent
}
button:disabled {
  opacity:.4;
  cursor:not-allowed
}
button:focus-visible,a:focus-visible {
  outline:3px solid #93b7fb;
  outline-offset:3px
}
input:focus-visible,select:focus-visible,textarea:focus-visible {
  outline:2px solid #9bbfff;
  outline-offset:1px
}
input,select,textarea {
  color:var(--text)
}
a {
  color:var(--accent);
  text-decoration:none
}
a:hover {
  text-decoration:underline
}
svg {
  display:block;
  flex-shrink:0
}
button span[data-icon] {

}
h1,h2,h3,p {

}
button, .card {
  transition:background .15s,border-color .15s,box-shadow .15s,transform .15s
}
button[hidden],[hidden] {

}
.sr-only {
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0
}
.rail {

  border-right:1px solid var(--border);

.brand {

}
.brand:hover {

}

  gap:12px
}
.rail-item {

  flex-direction:column;
  gap:6px;

  color:var(--muted);
  width:100%;

}
.rail-item>span:first-child {
  border-radius:15px;
  width:52px;
  height:38px;
  justify-content:center
}
.rail-item.active {
  color:var(--accent)
}
.rail-item:hover>span:first-child {

}
.rail-item.active>span:first-child {

.layers-button {

.popover {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow-lg);
  z-index:21
}
.layers-popover {
  position:absolute;
  bottom:135px;
  left:20px;
  width:285px;
  padding:18px
}
.popover-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:14px;
  font-weight:650;
  margin-bottom:16px
}
.icon-btn {
  width:30px;
  height:30px;
  border-radius:8px;
  color:var(--muted)
}
.icon-btn:hover {
  background:var(--surface-hover);
  color:var(--accent)
}
.layer-options {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.layer-option {
  display:flex;
  flex-direction:column;
  gap:8px;
  font-size:11px;
  border:1px solid var(--border);
  padding:8px;
  border-radius:11px
}
.layer-option.active {
  border-color:var(--accent);
  background:var(--accent-soft);
  color:var(--accent)
}
.layer-thumb {
  display:block;
  position:relative;
  height:60px;
  width:100%;
  border-radius:6px;
  overflow:hidden;
  background:linear-gradient(130deg,#d0e2c5 25%,#f4f2e9 25%,#f4f2e9 65%,#c2deea 65%)
}
.layer-thumb:before {
  content:"";
  position:absolute;
  width:200px;
  height:4px;
  background:white;
  left:-20px;
  top:20px;
  transform:rotate(-25deg);
  box-shadow:0 20px 0 #fff
}
.layer-thumb.live {
  background:linear-gradient(45deg,#e5dfcf 20%,#eff0df 20%,#eff0df 55%,#c1dec3 55%,#c1dec3 75%,#aecbd9 75%)
}
.switch-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  padding:15px 0;
  border-bottom:1px solid var(--border)
}
.switch {
  width:32px;
  height:19px;
  border-radius:12px;
  background:#d8dfe7;
  position:relative;
  display:inline-flex
}
.switch:after {
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  height:13px;
  width:13px;
  border-radius:50%;
  background:white;
  transition:left .2s
}
.switch.on {
  background:var(--accent)
}
.switch.on:after {
  left:16px
}
.subtext {
  font-size:11px;
  line-height:1.7;
  color:var(--muted)
}
.layers-popover .subtext {
  margin-top:12px;
  font-size:10px
}
.context-menu {
  position:absolute;
  min-width:210px;
  padding:6px;
  background:var(--surface);
  box-shadow:var(--shadow-lg);
  border:1px solid var(--border);
  border-radius:12px;
  z-index:40
}
.context-menu button {
  display:flex;
  justify-content:flex-start;
  width:100%;
  padding:10px;
  border-radius:7px;
  font-size:12px
}
.context-menu button:hover {
  background:var(--surface-hover)
}
.context-menu hr {
  border:0;
  border-top:1px solid var(--border);
  margin:5px
}
.context-coord {
  font-size:10px;
  color:var(--muted);
  padding:7px 10px
}
.panel-topline {
  display:flex;
  align-items:center;
  gap:8px;
  margin:13px 0 18px
}
.panel-topline h2 {
  font-size:19px;
  letter-spacing:-.4px;
  font-weight:650;
  flex:1
}
.panel-topline .icon-btn {
  margin-left:-6px
}
.result-count {
  font-size:11px;
  color:var(--muted);
  margin-bottom:12px
}
.empty-state {
  padding:36px 6px;
  text-align:center
}
.empty-icon {
  height:65px;
  width:65px;
  background:var(--accent-soft);
  color:var(--accent);
  border-radius:22px;
  display:grid;
  place-items:center;
  margin:0 auto 19px
}
.empty-icon svg {
  width:28px;
  height:28px
}
.empty-state h3 {
  font-size:18px;
  font-weight:600;
  margin-bottom:9px
}
.empty-state p {
  font-size:12px;
  line-height:1.8;
  color:var(--muted)
}
.primary-button {
  height:40px;
  border-radius:10px;
  background:var(--accent);
  color:white;
  font-size:12px;
  font-weight:600;
  padding:0 17px;
  gap:7px
}
.primary-button:hover {
  background:#1e5bc6
}
.secondary-button {
  height:38px;
  border:1px solid var(--border);
  border-radius:9px;
  background:var(--surface);
  font-size:12px;
  padding:0 13px
}
.secondary-button:hover {
  background:var(--surface-hover)
}
.full-width {
  width:100%
}
.action-row {
  display:flex;
  gap:10px;
  margin:19px 0;
  flex-wrap:wrap
}
.place-detail-hero {
  height:175px;
  margin:0 -22px 21px;
  width:calc(100% + 44px);
  border-radius:0
}
.place-detail-title {
  font-size:27px;
  font-weight:600;
  letter-spacing:-.7px;
  line-height:1.2
}
.place-detail-subtitle {
  font-size:12px;
  line-height:1.65;
  color:var(--muted);
  margin-top:9px
}
.place-actions {
  display:flex;
  justify-content:space-around;
  margin:25px 0;
  border-bottom:1px solid var(--border);
  padding-bottom:24px
}
.place-action {
  flex-direction:column;
  font-size:10px;
  gap:7px;
  color:var(--accent);
  min-width:53px
}
.place-action>span {
  border:1px solid #bdd3fa;
  border-radius:50%;
  height:39px;
  width:39px;
  display:grid;
  place-items:center
}
.place-action.primary>span {
  background:var(--accent);
  color:white;
  border:0
}
.place-action.active>span {
  background:var(--accent-soft)
}
.tags {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:15px 0
}
.tag {
  font-size:10px;
  padding:6px 9px;
  background:var(--surface-alt);
  color:var(--muted);
  border-radius:20px
}
.detail-info-row {
  display:flex;
  align-items:flex-start;
  gap:12px;
  margin:20px 0;
  font-size:12px;
  line-height:1.7
}
.detail-info-row svg {
  width:18px;
  color:var(--accent);
  margin-top:2px
}
.detail-info-row small {
  display:block;
  color:var(--muted);
  font-size:10px
}
.route-inputs {
  background:var(--surface-alt);
  border-radius:13px;
  padding:13px 12px;
  position:relative
}
.route-field {
  display:flex;
  align-items:center;
  gap:10px
}
.route-field+ .route-field {
  margin-top:12px
}
.route-field input {
  width:calc(100% - 42px);
  min-width:0;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px;
  font-size:11px;
  outline:0
}
.route-node {
  width:9px;
  height:9px;
  border:2px solid var(--accent);
  border-radius:50%;
  flex-shrink:0
}
.route-node.end {
  background:var(--accent);
  border-radius:3px
}
.route-swap {
  position:absolute;
  right:7px;
  top:42px;
  width:25px;
  height:25px;
  color:var(--muted)
}
.route-swap svg {
  width:16px
}
.mode-tabs {
  display:flex;
  gap:5px;
  padding:15px 0
}
.mode-tabs button {
  height:35px;
  flex:1;
  font-size:11px;
  border-radius:9px;
  color:var(--muted);
  border:1px solid var(--border)
}
.mode-tabs button.active {
  background:var(--accent-soft);
  border-color:#cadcfc;
  color:var(--accent)
}
.mode-tabs svg {
  height:16px;
  width:16px
}
.route-card {
  width:100%;
  text-align:left;
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  margin:12px 0;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px
}
.route-card.selected {
  border-color:#83adf7;
  background:var(--accent-soft)
}
.route-card h3 {
  font-size:13px;
  font-weight:600;
  line-height:1.6
}
.route-card small {
  font-size:10px;
  color:var(--muted);
  display:block;
  margin-top:5px;
  line-height:1.5
}
.route-time {
  font-size:19px;
  font-weight:600;
  color:var(--accent);
  white-space:nowrap;
  letter-spacing:-.5px
}
.route-time small {
  font-size:10px;
  letter-spacing:0;
  color:var(--muted)
}
.route-disclaimer {
  padding:12px;
  background:var(--surface-alt);
  border-radius:9px;
  font-size:10px;
  line-height:1.7;
  color:var(--muted);
  margin:12px 0
}
.steps-list {
  margin:10px 0;
  padding:0;
  list-style:none
}
.steps-list li {
  display:flex;
  gap:12px;
  font-size:11px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
  line-height:1.6
}
.steps-list li>span:first-child {
  color:var(--accent);
  font-size:10px;
  width:16px;
  padding-top:2px
}
.steps-list small {
  display:block;
  color:var(--muted);
  font-size:10px
}
.collection-card {
  padding:16px;
  border:1px solid var(--border);
  border-radius:13px;
  margin:13px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  text-align:left
}
.collection-card h3 {
  font-size:13px;
  font-weight:600
}
.collection-card p {
  font-size:11px;
  color:var(--muted);
  margin-top:7px
}
.collection-card .collection-icon {
  width:39px;
  height:39px;
  background:var(--accent-soft);
  border-radius:12px;
  color:var(--accent);
  display:grid;
  place-items:center;
  margin-right:12px
}
.collection-card>div:nth-child(2) {
  flex:1
}
.loading-line {
  height:3px;
  background:var(--accent-soft);
  overflow:hidden;
  border-radius:3px;
  margin:15px 0
}
.loading-line:after {
  content:"";
  display:block;
  width:35%;
  height:100%;
  background:var(--accent);
  animation:loading 1s infinite ease-in-out
}
@keyframes loading {
  from {
    transform:translateX(-100%)
  }
  to {
    transform:translateX(390%)
  }
}
.editor-toolbar {
  position:absolute;
  bottom:63px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:3px;
  padding:7px 9px;
  background:var(--surface);
  box-shadow:var(--shadow-lg);
  border:1px solid var(--border);
  border-radius:14px;
  z-index:14
}
.tool-button {
  height:35px;
  width:35px;
  border-radius:8px;
  position:relative;
  color:var(--muted)
}
.tool-button svg {
  height:18px;
  width:18px
}
.tool-button.active {
  background:var(--accent-soft);
  color:var(--accent)
}
.tool-button:hover {
  background:var(--surface-hover);
  color:var(--accent)
}
.tool-separator {
  width:1px;
  height:23px;
  background:var(--border);
  margin:0 4px
}
.inspector {
  position:absolute;
  top:78px;
  right:20px;
  width:280px;
  max-height:calc(100% - 115px);
  overflow:auto;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow-lg);
  z-index:16;
  scrollbar-width:thin;
  scrollbar-color:#d9e0e9 transparent
}
.inspector-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 17px 12px;
  border-bottom:1px solid var(--border)
}
.inspector-header h3 {
  font-size:13px;
  font-weight:650
}
.inspector-header small {
  font-size:9px;
  display:block;
  color:var(--muted);
  margin-top:4px
}
.inspector-section {
  padding:16px 17px;
  border-bottom:1px solid var(--border)
}
.inspector-section:last-child {
  border-bottom:0
}
.inspector-section-title {
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
  color:var(--muted);
  text-transform:uppercase;
  margin-bottom:13px
}
.field {
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-bottom:12px;
  min-width:0
}
.field:last-child {
  margin-bottom:0
}
.field>label {
  font-size:10px;
  color:var(--muted)
}
.field input:not([type=color]):not([type=range]),.field select,.field textarea {
  width:100%;
  min-width:0;
  border:1px solid var(--border);
  border-radius:7px;
  background:var(--surface-alt);
  padding:8px 10px;
  outline:0;
  font-size:11px
}
.field textarea {
  resize:vertical;
  min-height:72px;
  line-height:1.7
}
.field input[type=range] {
  width:100%;
  accent-color:var(--accent);
  height:16px
}
.field-pair {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}
.color-field {
  display:flex;
  align-items:center;
  border:1px solid var(--border);
  border-radius:7px;
  background:var(--surface-alt);
  height:34px;
  gap:8px;
  padding:4px 7px;
  font-size:10px;
  color:var(--muted)
}
input[type=color] {
  width:23px;
  height:23px;
  padding:0;
  border:0;
  background:transparent;
  cursor:pointer;
  flex-shrink:0
}
input[type=color]::-webkit-color-swatch-wrapper {
  padding:2px
}
input[type=color]::-webkit-color-swatch {
  border:0;
  border-radius:4px
}
.format-buttons {
  display:flex;
  gap:5px;
  margin-top:8px
}
.format-buttons button {
  width:34px;
  height:30px;
  border:1px solid var(--border);
  border-radius:6px
}
.format-buttons button.active {
  background:var(--accent-soft);
  border-color:#bbd3ff;
  color:var(--accent)
}
.format-buttons button svg {
  height:15px;
  width:15px
}
.inspector-empty {
  padding:20px 17px
}
.inspector-empty .empty-icon {
  height:47px;
  width:47px;
  border-radius:14px;
  margin:0 0 14px
}
.inspector-empty h4 {
  font-size:13px;
  font-weight:600;
  margin:0 0 8px
}
.inspector-empty p {
  font-size:11px;
  line-height:1.8;
  color:var(--muted)
}
.tool-help-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:17px
}
.tool-help-grid button {
  height:61px;
  align-items:flex-start;
  justify-content:center;
  flex-direction:column;
  border:1px solid var(--border);
  border-radius:9px;
  padding:10px;
  font-size:10px;
  color:var(--muted);
  gap:6px
}
.tool-help-grid svg {
  height:18px;
  width:18px;
  color:var(--accent)
}
.tool-help-grid button:hover {
  background:var(--accent-soft)
}
.inspector-status {
  font-size:10px;
  color:var(--muted);
  line-height:1.8;
  margin-top:11px
}
.feature-list {
  padding:6px 0
}
.feature-row {
  display:flex;
  gap:9px;
  align-items:center;
  padding:9px 10px;
  margin:4px 0;
  border:1px solid var(--border);
  border-radius:9px;
  cursor:pointer
}
.feature-row.selected {
  border-color:#a7c6fa;
  background:var(--accent-soft)
}
.feature-row>svg {
  width:16px;
  height:16px;
  color:var(--accent)
}
.feature-row-name {
  flex:1;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}
.feature-row .icon-btn {
  width:24px;
  height:24px
}
.feature-row .icon-btn svg {
  height:14px;
  width:14px
}
.feature-row.dim {
  opacity:.5
}
.project-title {
  width:100%;
  font-size:22px;
  font-weight:600;
  letter-spacing:-.6px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  margin:9px 0 7px;
  padding:0
}
.project-meta {
  font-size:10px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:6px
}
.project-meta .live-dot {
  width:4px;
  height:4px
}
.editor-hint {
  font-size:10px;
  line-height:1.8;
  padding:12px;
  background:var(--surface-alt);
  border-radius:9px;
  margin:18px 0
}
.vertex-coord {
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:10px;
  color:var(--muted)
}
.toast {
  position:fixed;
  left:calc(var(--map-shift) + (100% - var(--map-shift))/2);
  bottom:135px;
  transform:translateX(-50%);
  padding:12px 17px;
  background:#223040f2;
  color:#fff;
  border-radius:12px;
  z-index:100;
  box-shadow:var(--shadow-lg);
  font-size:12px;
  line-height:1.6;
  max-width:480px;
  text-align:center;
  backdrop-filter:blur(10px);
  pointer-events:none
}
.toast.error {
  background:#873c3cf5
}
dialog {
  border:1px solid var(--border);
  border-radius:21px;
  box-shadow:var(--shadow-lg);
  padding:0;
  width:min(530px,calc(100% - 32px));
  max-height:85vh;
  overflow:auto;
  background:var(--surface);
  color:var(--text)
}
dialog::backdrop {
  background:#16263759;
  backdrop-filter:blur(4px)
}
.modal-header {
  padding:23px 25px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--border)
}
.modal-header h2 {
  font-size:20px;
  letter-spacing:-.5px;
  font-weight:600
}
.modal-body {
  padding:22px 25px 25px
}
.modal-body p {
  font-size:12px;
  color:var(--muted);
  line-height:1.85;
  margin-bottom:14px
}
.modal-body h3 {
  font-size:13px;
  margin:20px 0 11px
}
.shortcuts {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px 25px
}
.shortcut {
  display:flex;
  justify-content:space-between;
  font-size:11px;
  align-items:center;
  color:var(--muted);
  gap:7px
}
.shortcut kbd {
  border:1px solid var(--border);
  border-radius:5px;
  background:var(--surface-alt);
  font-size:10px;
  padding:4px 6px;
  color:var(--text);
  white-space:nowrap
}
.provider-warning {
  border-left:3px solid #edbe69;
  padding:10px 13px;
  background:var(--surface-alt);
  font-size:10px;
  color:var(--muted);
  line-height:1.8;
  margin:15px 0
}
.drop-active:after {
  content:'Drop GeoJSON or an Wayline project';
  position:fixed;
  inset:20px;
  background:#edf3fff0;
  border:2px dashed var(--accent);
  z-index:150;
  display:grid;
  place-items:center;
  border-radius:20px;
  color:var(--accent);
  font-size:25px;
  pointer-events:none
}
[data-theme=dark] {
  color-scheme:dark;
  --bg:#171d26;
  --surface:#202834;
  --surface-alt:#1b2330;
  --surface-hover:#293445;
  --text:#e1e8f2;
  --muted:#8e9aac;
  --subtle:#68758a;
  --border:#2c3544;
  --accent:#78a8ff;
  --accent-soft:#273950;
  --accent-text:#8cb3f3;
  --shadow:0 3px 14px #05091245,0 1px 3px #05091222;
  --shadow-lg:0 12px 44px #060a1459
}
[data-theme=dark] .map-maker-card .maker-icon {
  background:#344c6a
}
[data-theme=dark] .map-maker-card p {
  color:#91a8c4
}
[data-theme=dark] .primary-button {
  color:#102b56
}
[data-theme=dark] .map-location-label,[data-theme=dark] .engine-pill,[data-theme=dark] .map-footer>span {
  background:#202834ed;
  border-color:#303b49;
  color:#b6c3d4
}
[data-theme=dark] .map-footer a {
  color:#a8bfda
}
[data-theme=dark] .scale {
  color:#c1cddb
}
[data-theme=dark] .scale i {
  border-color:#abb8c9
}
[data-theme=dark] .label-divider,[data-theme=dark] .engine-divider {
  background:#4c5d72
}
[data-theme=dark] .place-actions .place-action.primary>span {
  color:#132b50
